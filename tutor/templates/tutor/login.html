<<!DOCTYPE html>
<html lang="it">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Orientamento</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #e0f0ff;
            margin: 0;
            padding: 0;
        }
        #box {
            background: #f0f8ff;
            padding: 30px;
            width: 400px;
            margin: 80px auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        h2 {
            color: #0077cc;
            text-align: center;
            margin-bottom: 20px;
        }
        table {
            width: 100%;
        }
        td {
            padding: 8px;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        input[type="submit"], input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            margin: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        input[type="submit"] {
            background-color: #0077cc;
            color: white;
        }
        input[type="reset"] {
            background-color: #ccc;
            color: #333;
        }
        #msg {
            color: #c00;
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
        #links {
            text-align: center;
            margin-top: 15px;
        }
        #links a {
            text-decoration: none;
            color: #0077cc;
        }
        #links a:hover {
            text-decoration: underline;
        }
        #invio {
            text-align: center;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div id="box">
        <h2>Orientamento - Login</h2>
        <form method="post" action="{% url 'tutor:autentica' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <table>
                <tr>
                    <td>Utente:</td>
                    <td><input type="text" name="utente" required></td>
                </tr>
                <tr>
                    <td>Password:</td>
                    <td><input type="password" name="password" required></td>
                </tr>
            </table>
            <div id="invio">
                <input type="submit" value="Accedi">
                <input type="reset" value="Reset">
            </div>
            <div id="msg">{{ msg }}</div>
            <div id="links">
                <a href="{% url 'tutor:index' %}">Torna a Orientamento</a>
            </div>
        </form>
    </div>
</body>
</html>
